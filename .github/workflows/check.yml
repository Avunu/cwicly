name: Check

# Quality gates on every push and pull request (so Dependabot PRs are gated before
# auto-merge). Also called from release.yml to re-confirm the tagged commit
# before the zip is published. Jobs:
#   • nix-checks — the hermetic derivations: the plugin header, phpstan (level 0,
#                  own code only) and the PHPUnit unit suite (on PHP 8.4 and the
#                  8.3 floor)
#   • playground — the built plugin mounted into WordPress Playground: committed
#                  build-output asserts, PHP-level assertions and a headless-Chrome
#                  smoke pass over the admin screens and the front end
on:
  push:
    branches:
      - main
  pull_request:
  # Required for release.yml's `uses: ./.github/workflows/check.yml`.
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when invoked via workflow_call, so the
# standalone Check run and the Release-triggered one on the same push to main
# get separate groups instead of cancelling each other.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-checks:
    name: check / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - plugin-header
          - phpstan
          - unit
          - unit-php83
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      # Evaluating the package set performs a full-history builtins.fetchGit
      # clone per Composer package (composition-c4 fetches with allRefs=true);
      # no binary cache covers ~/.cache/nix/gitv3.
      - name: Cache Nix git fetches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/nix/gitv3
            ~/.cache/nix/fetcher-cache-v*.sqlite*
          key: nix-fetchgit-${{ hashFiles('composer.lock', 'tests/tools/composer.lock') }}
          restore-keys: nix-fetchgit-

      - run: nix build -L --no-link ".#checks.x86_64-linux.${{ matrix.check }}"

  playground:
    name: playground / WordPress ${{ matrix.wp }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # A continue-on-error job still reports success to downstream `needs`, so a
    # broken WordPress trunk can never block.
    continue-on-error: ${{ matrix.wp == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        wp: ["latest"]
        php: ["8.4"]
        include:
          # The declared floor (Requires PHP: 8.3), on the WordPress most sites run.
          - wp: latest
            php: "8.3"
    env:
      WP_VERSION: ${{ matrix.wp }}
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix git fetches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/nix/gitv3
            ~/.cache/nix/fetcher-cache-v*.sqlite*
          key: nix-fetchgit-${{ hashFiles('composer.lock', 'tests/tools/composer.lock') }}
          restore-keys: nix-fetchgit-

      # The harness mounts the built plugin (vendor/ with gutenberg-downgrade
      # included), exactly what the release zip contains.
      - run: nix build .#default -L

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/playground/package-lock.json

      - run: npm --prefix tests/playground ci

      - name: Committed build-output asserts
        run: npm --prefix tests/playground run test:assets

      - name: PHP-level assertions
        run: npm --prefix tests/playground run test:e2e

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - name: Headless browser smoke pass
        run: npm --prefix tests/playground run test:browser
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
